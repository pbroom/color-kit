<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">color-kit plane query: sRGB and Display P3 gamut boundaries with a WCAG AA contrast region</title>
<desc id="desc">An OKLCH lightness by chroma plane at hue 264. The filled sRGB gamut sits inside the larger Display P3 gamut, and a hatched region marks colors with at least 4.5:1 WCAG contrast against white. Every shape was computed by color-kit with definePlane, sense, and toSvgPath.</desc>
