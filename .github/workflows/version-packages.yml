name: Version Packages

# Opens (or updates) a "Version Packages" pull request on main whenever
# unreleased changesets are merged. Merging that PR bumps `color-kit`'s version
# and writes its CHANGELOG. This workflow never publishes: publishing to npm
# stays a manual step (`pnpm publish:next`), so no npm token is used here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: nothing by default; only the versioning job may write
# contents (the release branch) and pull requests. Every action that runs with
# that token is pinned to a commit SHA so a repointed tag cannot run new code.
permissions: {}

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        # changesets/action v2.1.2. No `publish-script` input, so the action
        # only versions; it never runs `npm publish`.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
