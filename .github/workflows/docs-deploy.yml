name: Docs deploy

# Vercel's Git integration is off (apps/docs/vercel.json sets
# git.deploymentEnabled to false), so these jobs are the only deploys:
# - Production: every push to main, but the concurrency group cancels older
#   runs, so a stack merge that lands many commits ships only the newest.
# - Preview: PRs labelled `preview`, or a manual run on any branch.
#
# Requires the VERCEL_TOKEN repository secret (a Vercel access token with
# access to the pbrooms-projects scope).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@65.9.0
  VERCEL_SCOPE: pbrooms-projects
  VERCEL_PROJECT: color-kit

jobs:
  production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: docs-production
      cancel-in-progress: true
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Link the Vercel project
        run: npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull production settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  preview:
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest
    # One preview per PR (or branch); a newer push cancels the older run.
    concurrency:
      group: docs-preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Link the Vercel project
        run: npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull preview settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "Docs preview: $URL (commit ${SHA::8})"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
