<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>color-kit</title>
    <meta
      name="description"
      content="color-kit is a queryable color engine: OKLCH-canonical conversion, contrast, gamut geometry and plane queries, with React bindings."
    />
    <!--head-meta-->
    <script>
      // Pre-paint theme: runs before CSS paints so there is no flash. Keep in
      // sync with src/site/theme.ts.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('color-kit-docs-theme-preference');
        } catch (error) {}
        var preference =
          stored === 'light' || stored === 'dark' ? stored : 'system';
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved =
          preference === 'system'
            ? prefersDark
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
